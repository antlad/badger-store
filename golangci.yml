run:
  concurrency: 4
  deadline: 5m
  issues-exit-code: 10
  tests: true

output:
  formats: colored-line-number
  print-issued-lines: true
  print-linter-name: true

linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - decorder
    - dupword
    - dupl
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - execinquery
    - exhaustive
    - exportloopref
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - goconst
    - gocritic
    - gocyclo
    - goerr113
    - goimports
    - gomnd
    - goprintffuncname
    - gosec
    - gosimple
    - govet
    - grouper
    - importas
    - interfacebloat
    - ireturn
    - loggercheck
    - makezero
    - misspell
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - prealloc
    - predeclared
    - promlinter
    - reassign
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - stylecheck
    - tenv
    - typecheck
    - thelper
    - unconvert
    - usestdlibvars
    - whitespace
  fast: false

linters-settings:
  asasalint:
    use-builtin-exclusions: true
    ignore-test: false

  decorder:
    dec-order:
      - type
      - const
      - var
      - func
    disable-dec-order-check: false
    disable-init-func-first-check: false
    disable-dec-num-check: true
  errcheck:
    check-type-assertions: false
    check-blank: true
    disable-default-exclusions: false
    exclude-functions:
      - encoding/json.Marshal
      - encoding/json.MarshalIndent
  errchkjson:
    check-error-free-encoding: true
    report-no-exported: false
  errorlint:
    errorf: true
    errorf-multi: true
    asserts: true
    comparison: true
  exhaustive:
    check:
      - switch
      - map
    default-signifies-exhaustive: true
  funlen:
    lines: -1
    statements: 40

  goconst:
    min-len: 3
    min-occurrences: 2
    ignore-tests: true
    match-constant: true
    numbers: true
    min: 3
    max: 3
    ignore-calls: false
  gci:
    sections:
      - standard
      - default
      - blank
      - dot
    skip-generated: true
    custom-order: true
  gocyclo:
    min-complexity: 20

  gomnd:
    checks:
      - argument
      - case
      - operation
      - return
      - assign
  maligned:
    suggest-new: true
  nestif:
    min-complexity: 10
  dupl:
    threshold: 150
  misspell:
    locale: US
  ireturn:
    allow:
      - error
      - generic
      - fx.Option
      - .*(Res)$ # ogen responses
issues:
  exclude-files:
    - \*_gen\.go
    - \*_mock\.go
    - \*pb\.go
  exclude-rules:
    - path: _test\.go
      linters:
        - containedctx
        - contextcheck
        - dupl
        - dupword
        - errname
        - exhaustive
        - forcetypeassert
        - funlen
        - gci
        - gochecknoglobals
        - gochecknoinits
        - goconst
        - gocritic
        - gocyclo
        - goerr113
        - gosec
        - nilerr
        - noctx
        - promlinter
        - reassign
        - unparam
        - ireturn
  exclude-use-default: true
  max-issues-per-linter: 0
  max-same-issues: 0
